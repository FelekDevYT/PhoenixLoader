plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'me.felek.fenix'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://libraries.minecraft.net" }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("net.bytebuddy:byte-buddy:1.17.8")
    implementation("net.bytebuddy:byte-buddy-agent:1.18.4")

    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.0")
    implementation("org.jetbrains.kotlin:kotlin-scripting-jsr223:2.2.0")
    implementation("org.jetbrains.kotlin:kotlin-scripting-jvm-host-embeddable:1.3.72")

    implementation 'org.apache.groovy:groovy:5.0.0'
    implementation 'org.apache.groovy:groovy-jsr223:5.0.0'

    implementation 'org.json:json:20240303'

    compileOnly 'com.mojang:datafixerupper:8.0.16'
    compileOnly 'com.mojang:brigadier:1.3.10'

    compileOnly fileTree('libs/mc_libs')
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Premain-Class': 'dev.felek.phoenix.PhoenixAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes': 'true'
        )
    }
}