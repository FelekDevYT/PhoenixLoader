plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '9.0.2'
    id 'org.spongepowered.gradle.vanilla' version '0.3.2'
}

group = 'me.felek.fenix'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://libraries.minecraft.net" }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("net.bytebuddy:byte-buddy:1.17.8")
    implementation("net.bytebuddy:byte-buddy-agent:1.18.4")

    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.0')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-script-runtime'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-common'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-jvm'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-jsr223'
    implementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable'
    implementation 'org.jetbrains.kotlin:kotlin-scripting-compiler-impl-embeddable'

    implementation 'org.jruby:jruby:10.1.0.0'

    implementation 'org.python:jython-standalone:2.7.4'

    implementation 'org.apache.groovy:groovy:5.0.0'
    implementation 'org.apache.groovy:groovy-jsr223:5.0.0'

    implementation 'org.json:json:20240303'

    compileOnly 'com.mojang:datafixerupper:8.0.16'
    compileOnly 'com.mojang:brigadier:1.3.10'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveClassifier = ''
    zip64 = true
    mergeServiceFiles()

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.txt'
    exclude 'META-INF/*.md'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.kotlin_module'
    exclude '**/*.html'

    manifest {
        attributes(
                'Premain-Class': 'dev.felek.phoenix.PhoenixAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes': 'true'
        )
    }
}

minecraft {
    version("26.2")
    runs {
        client {
            displayName("PhoenixMC dev run")
            jvmArgs "-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}"
            jvmArgs '-Xmx4096m', '-Xms512m'
        }
    }
}

tasks.named('runClient') {
    dependsOn tasks.shadowJar
}